name: Verify and publish policy benchmark v1

on:
  push:
    branches: [main]
    paths:
      - 'mcp-special-analysis-tools/policy-benchmark-v1/**'
      - '.github/workflows/policy-benchmark-release.yml'
  pull_request:
    paths:
      - 'mcp-special-analysis-tools/policy-benchmark-v1/**'
      - '.github/workflows/policy-benchmark-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BENCHMARK_DIR: mcp-special-analysis-tools/policy-benchmark-v1
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mcp-special-analysis-tools/policy-benchmark-v1/requirements.txt
      - name: Install pinned generator dependencies
        run: python -m pip install -r "$BENCHMARK_DIR/requirements.txt"
      - name: Generate synthetic files and verify release against actual MCP inputs
        run: |
          python "$BENCHMARK_DIR/generate.py" --output out/policy-benchmark-v1
          python "$BENCHMARK_DIR/package.py" out/policy-benchmark-v1 \
            --output out/release \
            --verification "$BENCHMARK_DIR/evaluation/verification-receipt.json"
          python "$BENCHMARK_DIR/write_catalog.py" out/policy-benchmark-v1 --output out/registry.json
          cmp registry.json out/registry.json
      - name: Publish this immutable version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view policy-benchmark-v1 >/dev/null 2>&1; then
            echo 'policy-benchmark-v1 already exists; no assets were replaced. Use a new version for another release.'
            exit 1
          fi
          gh release create policy-benchmark-v1 out/release/* \
            --target "$GITHUB_SHA" \
            --title 'Synthetic policy research benchmarks v1' \
            --notes-file "$BENCHMARK_DIR/RELEASE-NOTES.md"
